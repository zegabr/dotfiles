# ==============================================================================
# Kitty Terminal Configuration (~/.config/kitty/kitty.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# macOS Keyboard & Clipboard Integration
# ------------------------------------------------------------------------------
# Treat both Left and Right Option keys as Alt (for tmux M-* bindings, vim, etc.)
# Note: Kitty only attaches its Cocoa text-input filter when an OS window is
# created, so changing this from the default requires restarting Kitty (Cmd+Q)
# or opening a new OS window (Cmd+N) rather than just live-reloading.
macos_option_as_alt yes

# Send Esc+b / Esc+f for Option+Left / Option+Right word navigation in /bin/bash
map alt+left  send_text all \x1bb
map alt+right send_text all \x1bf

# Allow applications (tmux, Neovim, SSH via OSC 52) to read & write OS clipboard without prompts
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Explicit OS clipboard copy/paste shortcuts
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# ------------------------------------------------------------------------------
# Font & Window Appearance
# ------------------------------------------------------------------------------
font_family      Monaco
font_size        12.0

# Clean window appearance for AeroSpace tiling
confirm_os_window_close 0
enable_audio_bell       no

# ------------------------------------------------------------------------------
# Theme: Gruvbox Dark Medium (Dark theme with soft #282828 charcoal background)
# ------------------------------------------------------------------------------
background            #282828
foreground            #ebdbb2
selection_background  #665c54
selection_foreground  #ebdbb2
url_color             #83a598
cursor                #ebdbb2
cursor_text_color     #282828

# Tabs
active_tab_background   #504945
active_tab_foreground   #fbf1c7
inactive_tab_background #3c3836
inactive_tab_foreground #a89984

# Black (Dark gray instead of pure black)
color0  #282828
color8  #928374

# Red
color1  #cc241d
color9  #fb4934

# Green
color2  #98971a
color10 #b8bb26

# Yellow
color3  #d79921
color11 #fabd2f

# Blue
color4  #458588
color12 #83a598

# Magenta / Purple
color5  #b16286
color13 #d3869b

# Cyan / Aqua
color6  #689d6a
color14 #8ec07c

# White / Light Gray
color7  #a89984
color15 #ebdbb2
