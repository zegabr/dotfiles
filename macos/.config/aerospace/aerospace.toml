# ==============================================================================
# AeroSpace Configuration (~/.config/aerospace/aerospace.toml)
# ==============================================================================
config-version = 2
auto-reload-config = true
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Sets the baseline rules for new containers
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'
accordion-padding = 0

gaps.inner.horizontal = 0
gaps.inner.vertical   = 0
gaps.outer.left       = 0
gaps.outer.bottom     = 0
gaps.outer.top        = 0
gaps.outer.right      = 0

persistent-workspaces = ["1", "2", "3", "4", "5", "6"]

# ------------------------------------------------------------------------------
# Window Routing Rules (Aggressive Accordion Enforcement)
# ------------------------------------------------------------------------------
# * Changed: Added 'layout accordion' to EVERY rule so that when a new window 
#   is created (like pressing Cmd+N), it instantly forces the layout to stack.

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.pommaclcbfghclhalboakcipcmmndhcj'
run = ['move-node-to-workspace 3', 'layout accordion']

[[on-window-detected]]
if.app-name-regex-substring = '(?i)chat'
run = ['move-node-to-workspace 3', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.ahdfkjhgpgcbfkeoehapbdafbjlnpejh'
run = ['move-node-to-workspace 4', 'layout accordion']

[[on-window-detected]]
if.app-name-regex-substring = '(?i)duckie'
run = ['move-node-to-workspace 4', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.agimnkijcaahngcdmfeangaknmldooml'
run = ['move-node-to-workspace 5', 'layout accordion']

[[on-window-detected]]
if.app-name-regex-substring = '(?i)youtube'
run = ['move-node-to-workspace 5', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = ['move-node-to-workspace 2', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace 1', 'layout accordion']

# ------------------------------------------------------------------------------
# Keybindings
# ------------------------------------------------------------------------------
[mode.main.binding]

# --- Direct Workspace Switching (Forces stack on arrival & spawns app if empty) ---
cmd-1 = ['workspace 1', 'layout accordion', 'exec-and-forget ~/.local/bin/aerospace-workspace-or-spawn 1']
cmd-2 = ['workspace 2', 'layout accordion', 'exec-and-forget ~/.local/bin/aerospace-workspace-or-spawn 2']
cmd-3 = ['workspace 3', 'layout accordion', 'exec-and-forget ~/.local/bin/aerospace-workspace-or-spawn 3']
cmd-4 = ['workspace 4', 'layout accordion', 'exec-and-forget ~/.local/bin/aerospace-workspace-or-spawn 4']
cmd-5 = ['workspace 5', 'layout accordion', 'exec-and-forget ~/.local/bin/aerospace-workspace-or-spawn 5']
cmd-6 = ['workspace 6', 'layout accordion', 'exec-and-forget ~/.local/bin/aerospace-workspace-or-spawn 6']

# --- Swap between maximized windows ---
# * Changed: Forces the workspace to stay in accordion mode every time you swap
cmd-left = ['focus left', 'layout accordion']
cmd-right = ['focus right', 'layout accordion']

# --- Move Focused Window to Workspace ---
ctrl-shift-1 = ['move-node-to-workspace 1', 'layout accordion']
ctrl-shift-2 = ['move-node-to-workspace 2', 'layout accordion']
ctrl-shift-3 = ['move-node-to-workspace 3', 'layout accordion']
ctrl-shift-4 = ['move-node-to-workspace 4', 'layout accordion']
ctrl-shift-5 = ['move-node-to-workspace 5', 'layout accordion']
ctrl-shift-6 = ['move-node-to-workspace 6', 'layout accordion']

# --- Window / Layout Management ---
cmd-m = []
ctrl-cmd-m = 'fullscreen'
ctrl-cmd-f = 'layout floating tiling'
ctrl-cmd-tab = 'workspace-back-and-forth'
ctrl-cmd-shift-r = 'reload-config'
ctrl-cmd-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
